name: Build Fox Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - fox-ultimate
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Fox Ultimate
        run: pio run -e fox_ultimate

      - name: Prepare firmware
        run: |
          cp .pio/build/fox_ultimate/firmware.bin FoxUltimate-TEmbed-v1.0.0.bin
          cp .pio/build/fox_ultimate/bootloader.bin FoxUltimate-bootloader.bin || true
          cp .pio/build/fox_ultimate/partitions.bin FoxUltimate-partitions.bin || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxUltimate-TEmbed-v1.0.0
          path: |
            FoxUltimate-TEmbed-v1.0.0.bin
            FoxUltimate-bootloader.bin
            FoxUltimate-partitions.bin
          if-no-files-found: warn
